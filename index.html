<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D2B45" />

    <!-- SEO Meta Tags -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="MKM Air Travels Pvt. Ltd." />
    <meta name="keywords" content="corporate travel company Delhi, IATA accredited travel agent India, travel management company New Delhi, MICE travel agency, group travel handling, corporate flight booking, hotel booking agent Delhi, visa assistance India, airport transfer Delhi, TAAI affiliated travel agent, travel agency Janakpuri" />
    <meta name="language" content="en" />
    <meta name="revisit-after" content="7 days" />

    <!-- Geo tags for local SEO -->
    <meta name="geo.region" content="IN-DL" />
    <meta name="geo.placename" content="New Delhi" />
    <meta name="geo.position" content="28.6288696;77.0912057" />
    <meta name="ICBM" content="28.6288696, 77.0912057" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Default title & description (overridden per-page by react-helmet-async) -->
    <title>MKM Air Travels Pvt. Ltd. | Corporate Travel Company in New Delhi</title>
    <meta name="description" content="MKM Air Travels Pvt. Ltd. is an IATA accredited and TAAI affiliated travel management company with 25+ years of expertise in corporate travel, group handling, MICE, flights, hotels, visas, and transfers." />

    <!-- =====================================================================
         GOOGLE SEARCH CONSOLE VERIFICATION
         After setting up Google Search Console, paste the verification meta tag below.
         It will look like this:
         <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE_HERE" />
         ===================================================================== -->

    <!-- =====================================================================
         GOOGLE ANALYTICS (GA4)
         After creating a GA4 property, paste your tracking script below.
         It will look like this:
         <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
         <script>
           window.dataLayer = window.dataLayer || [];
           function gtag(){dataLayer.push(arguments);}
           gtag('js', new Date());
           gtag('config', 'G-XXXXXXXXXX');
         </script>
         ===================================================================== -->
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
